<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laporan Pengamatan Buah Alami</title>
    <style>
body {
  font-family: Arial, sans-serif;
  font-size: 12px;
  margin: 0;
  padding: 20px;
  position: relative;   /* penting agar .bg-img mengikuti body */
  z-index: 0;
}

.bg-img {
  position: absolute;   /* mengikuti tinggi body */
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;         /* otomatis mengikuti tinggi body */
  
  background-image: url('https://www.greatgiantfoods.com/wp-content/uploads/2018/11/GGF-logo-white.jpg');
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;

  opacity: 0.08; 
  z-index: -1;
  pointer-events: none;
}

        .container {
            max-width: 100%;
            overflow-x: auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #000;
            padding: 4px;
            text-align: center;
            vertical-align: middle;
            height: 20px;
			border-color: darkgray;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .header {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .company-name {
            font-size: 14px;
            font-weight: bold;
        }
        .form-title {
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0;
        }
        .location-info {
            margin: 10px 0;
        }
        .section-title {
            font-weight: bold;
            text-align: center;
            background-color: #e6e6e6;
        }
        .empty-row {
            height: 20px;
        }
        .footer {
            margin-top: 20px;
        }
        .signature-section {
            margin-top: 30px;
        }
        .signature-line {
            border-top: 1px solid #000;
            width: 200px;
            margin-top: 40px;
        }
        .logo-container {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0px;
        }
        .title-doc{
			position: absolute;
			width: 100%;
			text-align: center;
			
		}
        .doc-header {
			display: flex;
			align-items: center;
			position: relative;
			border-color: black;
			border-style: double;
			background-color: #fff9d5;
        }
		.company-section {
			padding: 8px;
			border-color: black;
			border-right: black double;
		}
        .title-doc h1 {
            padding: 16px 0 16px 0px;
            margin: 0;
            text-align: center;
            font-size: 18px;
        }
        .company-info {
            text-align: left;
        }
        /* Style baru untuk info-doc */
        .info-doc {
			display: flex;
			justify-content: center;
			margin: 10px 0;
        }
        .info-item {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 4px 8px;
        }
        .info-label {
            font-weight: bold;
			margin-right: 5px;
			white-space: nowrap;
        }
        .info-value {
            min-width: 160px;
			border-bottom: 1px solid #000;
			padding: 0px 0px 12px 36px;
        }
        /* Style baru untuk doc-footer */
        .doc-footer {
            display: flex;
            width: 100%;
            margin-top: 30px;
        }
        .footer-left {
            flex: 1;
            display: flex;
        }
        .footer-right {
            flex: 1;
        }
        .footer-section {
            flex: 1;
            padding: 0 10px;
        }
        .footer-header {
            font-weight: bold;
            margin-bottom: 5px;
            text-align: left;
        }
        .signature-area {
            height: 60px;
            border-bottom: 0px solid #000;
            margin-bottom: 5px;
        }
		.signature-name {
			text-align: center;
			font-weight: 600;
			margin-bottom: 4px;
		}
        .signature-label {
            text-align: center;
        }
        .diketahui-header {
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }
        .diketahui-container {
            display: flex;
        }
        .diketahui-section {
            flex: 1;
            padding: 0 10px;
        }
        .diketahui-container .signature-label {
            text-align: center;
        }
        .diketahui-container .signature-name {
            text-align: center;
        }
        .footer-section .signature-area {
            text-align: center;
        }
    </style>
</head>
